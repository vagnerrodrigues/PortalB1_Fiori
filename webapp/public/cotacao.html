<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cotação</title>
<style>
  :root {
    --header: #070070; --headerText: #fff; --accent: #035DD0; --primary: #070070;
    --bg: #f3f5f9; --card: #fff; --text: #1d2433; --muted: #5d6677; --line: #dfe3ea;
    --ok: #107e3e; --warn: #b75c00; --err: #bb0000; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  header { background: var(--header); color: var(--headerText); border-bottom: 4px solid var(--accent); }
  .bar { max-width: 1080px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .bar img { height: 28px; width: auto; }
  .bar .co { font-weight: 600; opacity: .95; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 120px; }
  h1 { font-size: 1.45rem; margin: 0 0 4px; color: var(--header); }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 18px; }
  .chip { background: #e8edf7; color: var(--header); border-radius: 999px; padding: 4px 12px; font-size: .85rem; font-weight: 600; }
  .chip.warn { background: #fff1e0; color: var(--warn); }
  .chip.ok { background: #e3f4ea; color: var(--ok); }
  .chip.err { background: #fde7e7; color: var(--err); }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(16,24,40,.08); padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .msg { white-space: pre-line; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); padding: 8px 6px; border-bottom: 2px solid var(--line); }
  td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .item b { display: block; }
  .item small { color: var(--muted); }
  input[type=text], input[type=date], select, textarea {
    font: inherit; width: 100%; padding: 8px 10px; border: 1px solid #b9c1ce; border-radius: 6px; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  input.price { text-align: right; max-width: 140px; }
  input.invalid { border-color: var(--err); background: #fff6f6; }
  input:disabled { background: #f1f3f6; color: var(--muted); }
  .skip { display: flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--muted); margin-top: 6px; cursor: pointer; }
  tr.skipped .item b { text-decoration: line-through; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 16px; }
  label.f { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .footer { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -4px 14px rgba(16,24,40,.08); }
  .footer .in { max-width: 1080px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .total { font-size: 1.15rem; font-weight: 700; margin-right: auto; }
  .total small { display: block; font-size: .78rem; color: var(--muted); font-weight: 400; }
  button { font: inherit; font-weight: 600; border-radius: 6px; padding: 10px 18px; cursor: pointer; border: 1px solid transparent; }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover { filter: brightness(1.08); }
  .ghost { background: transparent; color: var(--muted); border-color: #b9c1ce; }
  button:disabled { opacity: .55; cursor: default; }
  .alert { border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }
  .alert.err { background: #fde7e7; color: var(--err); }
  .alert.ok { background: #e3f4ea; color: var(--ok); }
  .alert.info { background: #e8edf7; color: var(--header); }
  .decline { display: none; margin-top: 12px; }
  .decline.show { display: block; }
  .center { text-align: center; padding: 60px 16px; color: var(--muted); }
  @media (max-width: 720px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
    td { border: 0; padding: 4px 0; }
    td.num { text-align: left; }
    td[data-l]::before { content: attr(data-l); display: block; font-size: .75rem; color: var(--muted); text-transform: uppercase; }
    input.price { max-width: none; }
    .footer .in { gap: 8px; }
    .footer button { flex: 1; }
  }
</style>
</head>
<body>
<header><div class="bar"><img id="logo" alt="" hidden><span class="co" id="company"></span></div></header>
<main id="app"><div class="center">Carregando cotação…</div></main>
<div class="footer" id="footer" hidden>
  <div class="in">
    <div class="total"><small>Total da proposta</small><span id="total">R$ 0,00</span></div>
    <button class="ghost" id="btnDecline" type="button">Não vou cotar</button>
    <button class="primary" id="btnSend" type="button">Enviar cotação</button>
  </div>
</div>
<script src="/public/cotacao.js"></script>
</body>
</html>
